.screen.active{display:flex;animation:rise .3s ease both}
@keyframes rise{from{transform:translateY(7px)}to{transform:none}}

.wordmark{text-align:center;margin-top:38px}

.cover-sub b{color:var(--ink);font-weight:600}
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:190px;margin:4px 0}
.stage-emoji{font-size:104px;line-height:1;animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-9px) scale(1.035)}}
.cover-meta{text-align:center;color:var(--ink3);font-size:12px;margin-top:6px;letter-spacing:.03em}

/* 按钮 */
.btn{display:block;width:100%;border:none;cursor:pointer;background:var(--ink);color:#fff;

.btn:active{transform:scale(.977)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn+.btn{margin-top:10px}

/* 答题 */

.progress-text{font-size:12px;color:var(--ink2);letter-spacing:.06em}

.bar{height:3px;background:var(--line);border-radius:2px;margin:12px 0 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:2px;transition:width .3s ease}
.q-card{margin-top:24px;flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:5vh}
.q-label{font-size:12px;color:var(--ink3);letter-spacing:.1em;margin-bottom:10px}

.q-ask{font-size:13px;color:var(--ink2);margin:0 0 20px;letter-spacing:.02em}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 15px;
  font-size:14.5px;line-height:1.6;color:var(--ink);font-family:inherit;
  transition:border-color .16s ease,background .16s ease,transform .12s ease}
.opt:active{transform:scale(.985)}
.opt .dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line);
  flex:0 0 auto;margin-top:4px;transition:all .16s ease}
.opt:hover{border-color:#d8cdbd}
.opt.pick{border-color:var(--ink);background:#fff}
.opt.pick .dot{border-color:var(--ink);background:var(--ink);box-shadow:inset 0 0 0 2.5px var(--card)}

/* 结果 */
#result{padding-top:0}
.banner{margin:0 -22px 0;padding:28px 22px 18px;text-align:center}
.banner-emoji{font-size:74px;line-height:1;display:block;margin-bottom:10px}
.res-name{font-size:29px;font-weight:800;letter-spacing:.03em;margin:0}

.res-desc{font-size:14px;line-height:1.85;color:#4a443d;margin:16px 0 0}

.sim{text-align:center;font-size:11.5px;color:var(--ink3);margin-top:12px;letter-spacing:.03em}

const screens = {cover:$("#cover"), quiz:$("#quiz"), result:$("#result"), gallery:$("#gallery")};
function show(n){
  Object.values(screens).forEach(s => s.classList.remove("active"));

let idx = 0, raw = {}, picked = null, answers = {}, result = null;

function renderQ(){
  const q = QUIZ[idx];
  $("#progText").textContent = (idx+1) + " / " + QUIZ.length;
  $("#barFill").style.width = ((idx+1)/QUIZ.length*100) + "%";
  $("#qLabel").textContent = String(q.no).padStart(2,"0") + " · " + q.short;
  $("#qScene").textContent = q.scene;
  $("#prevBtn").style.visibility = idx === 0 ? "hidden" : "visible";

  const box = $("#opts");
  box.innerHTML = "";
  picked = null;
  q.opts.forEach(function(o){
    const text = o[0], score = o[1];
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = '<span class="dot"></span><span></span>';
    b.lastChild.textContent = text;
    b.onclick = function(){
      if (picked !== null) return;
      box.querySelectorAll(".opt").forEach(el => el.classList.remove("pick"));
      b.classList.add("pick");
      picked = score;
      answers[idx] = {dim:q.dim, score:score};
      setTimeout(function(){
        idx++;
        if (idx < QUIZ.length) renderQ(); else showResult();
      }, 280);
    };
    box.appendChild(b);
  });
}

$("#prevBtn").onclick = function(){
  if (idx === 0) return;
  idx--;
  delete answers[idx];
  renderQ();
};

function cos(u, v){
  let du = 0, dv = 0, s = 0;
  for (let i=0;i<u.length;i++){ s += u[i]*v[i]; du += u[i]*u[i]; dv += v[i]*v[i]; }
  if (du < 1e-9 || dv < 1e-9) return 0;
  return s / (Math.sqrt(du) * Math.sqrt(dv));
}

function showResult(){
  raw = {}; DIMS.forEach(d => raw[d.k] = 0);
  for (const k in answers){ raw[answers[k].dim] += answers[k].score; }

  const vec = DIMS.map(d => raw[d.k] / MAX_PER_DIM);
  const strength = Math.sqrt(vec.reduce((a,x)=>a+x*x,0));

  const ranked = BREEDS.map(function(b){
    return {breed:b, sim:cos(vec, b.vec)};
  }).sort((a,b) => b.sim - a.sim);

  const main = ranked[0], shadow = ranked[1], b = main.breed;
  result = {key:b.key, name:b.name, tagline:b.tagline, sim:main.sim, strength:strength};

  const n = parseInt(b.color, 16);   // 数据里的颜色不带 #，这里不要再 slice
  const rgba = (a) => "rgba(" + (n>>16&255) + "," + (n>>8&255) + "," + (n&255) + "," + a + ")";
  $("#banner").style.background = "linear-gradient(180deg," + rgba(.22) + "," + rgba(.05) + " 55%,transparent)";
  document.documentElement.style.setProperty("--accent", "#" + b.color);

  $("#resEmoji").textContent = b.emo;
  $("#resName").textContent = b.name;
  $("#resTitle").textContent = "—— " + b.tagline;
  $("#resDesc").textContent = b.desc;
  $("#resTags").innerHTML = b.tags.split(" / ").map(t => '<span class="tag">' + t + '</span>').join("");

  $("#subCats").innerHTML = '<div class="sub-cat">你身上还带点 <b>' + shadow.breed.name + " · " + shadow.breed.tagline + "</b> 的影子</div>";
  $("#subCats").style.display = "flex";

  let simText = "和「" + b.name + "」的契合度 " + Math.round(Math.max(0, main.sim)*100) + "%";
  if (strength < WEAK_THRESHOLD) simText += " · 你的答案偏向不明显，这个结果参考着看";
  $("#resSim").textContent = simText;

  const p = BREED_MAP[b.pair], bd = BREED_MAP[b.buddy];
  $("#pairLine").innerHTML = "最佳配对：<b>" + p.name + " · " + p.tagline + "</b>（" + b.combo + "）<br>最佳友伴：<b>" + bd.name + " · " + bd.tagline + "</b>";

  renderChart();
  show("result");
}

function renderChart(){
  const maxAbs = Math.max(1, ...DIMS.map(d => Math.abs(raw[d.k])));
  // 直接写内联高度，不用 requestAnimationFrame：后台标签页会被节流，rAF 不回调，柱子就永远是空的
  $("#chart").innerHTML = DIMS.map(function(d){
    const v = raw[d.k];
    const h = Math.round(Math.abs(v) / maxAbs * 100);
    return '<div class="bar-item">'
      + '<div class="bar-track"><div class="bar-mid"></div>'
      + '<div class="bar-fill" style="height:' + h + '%;opacity:' + (v < 0 ? .35 : 1) + '"></div></div>'
      + '<div class="bar-label">' + d.n + '</div>'
      + '<div class="bar-val">' + (v > 0 ? "+" : "") + v + '</div>'
      + '</div>';
  }).join("");
}

function renderGallery(){
  $("#galleryCount").textContent = BREEDS.length + " 种";
  $("#galleryList").innerHTML = BREEDS.map(function(b){
    const p = BREED_MAP[b.pair], bd = BREED_MAP[b.buddy];
    return '<div class="g-card">'
      + '<div class="g-head2"><span class="g-dot" style="background:#' + b.color + '"></span>'
      + '<div><div class="g-name">' + b.emo + " " + b.name + '</div>'
      + '<div class="g-tagline">' + b.tagline + '</div></div></div>'
      + '<div class="g-tags">' + b.tags.split(" / ").map(t => '<span class="g-tag">' + t + '</span>').join("") + '</div>'
      + '<div class="g-desc">' + b.desc + '</div>'
      + '<div class="g-pair">最佳配对：' + p.name + '（' + b.combo + '）｜最佳友伴：' + bd.name + '</div>'
      + '</div>';
  }).join("");
}

async function copyText(text){
  try {
    await navigator.clipboard.writeText(text);
    alert("已复制，去微信粘贴发送吧");
  } catch(e){
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); alert("已复制，去粘贴发送吧"); } catch(_){}
    document.body.removeChild(ta);
  }
}

$("#startBtn").onclick = function(){ raw = {}; answers = {}; idx = 0; renderQ(); show("quiz"); };
$("#againBtn").onclick = function(){ raw = {}; answers = {}; idx = 0; renderQ(); show("quiz"); };
$("#galleryBtn").onclick = function(){ renderGallery(); show("gallery"); };
$("#galleryBack").onclick = function(){ show("result"); };

$("#shareBtn").onclick = async function(){
  const r = result || {name:"", tagline:""};
  const text = "我测出来是「" + r.name + "·" + r.tagline + "」，你也来测测 " + SITE_URL;
  if (navigator.share){
    try { await navigator.share({title: document.title, text: text, url: SITE_URL}); return; }
    catch(e){ if (e && e.name === "AbortError") return; }
  }
  copyText(text);
};

$("#coverEmoji").textContent = BREEDS[Math.floor(Math.random()*BREEDS.length)].emo;
</script>
